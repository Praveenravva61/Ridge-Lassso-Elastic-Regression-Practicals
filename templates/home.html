<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f7fc;
        }

        .container-box{
            max-width:700px;
            margin:50px auto;
            padding:30px;
            background:white;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#0d6efd;
        }

        .prediction{
            margin-top:20px;
            text-align:center;
            font-size:24px;
            font-weight:bold;
            color:green;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="container-box">

        <h1>Forest Fire Prediction</h1>

        <form action="{{ url_for('predict') }}" method="post">

            <div class="mb-3">
                <label class="form-label">Temperature</label>
                <input type="number" step="any" class="form-control" name="Temperature" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Relative Humidity (RH)</label>
                <input type="number" step="any" class="form-control" name="RH" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Wind Speed (Ws)</label>
                <input type="number" step="any" class="form-control" name="Ws" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Rain</label>
                <input type="number" step="any" class="form-control" name="Rain" required>
            </div>

            <div class="mb-3">
                <label class="form-label">FFMC</label>
                <input type="number" step="any" class="form-control" name="FFMC" required>
            </div>

            <div class="mb-3">
                <label class="form-label">DMC</label>
                <input type="number" step="any" class="form-control" name="DMC" required>
            </div>

            <div class="mb-3">
                <label class="form-label">ISI</label>
                <input type="number" step="any" class="form-control" name="ISI" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Classes</label>
                <input type="number" step="any" class="form-control" name="Classes" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Predict
                </button>
            </div>

        </form>

        {% if prediction_text %}
        <div class="prediction">
            {{ prediction_text }}
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
